# Two app instances behind nginx. N>=2 is the point: the interesting bugs
# (shared limiter state, duplicate short codes, cache coherence) do not exist
# at N=1, so a single-instance demo proves nothing about them.
services:
  app1:
    build: .
    environment: { INSTANCE_ID: "1", SHORTENER_DATA: "/data" }
    volumes: ["shared:/data"]
  app2:
    build: .
    environment: { INSTANCE_ID: "2", SHORTENER_DATA: "/data" }
    volumes: ["shared:/data"]
  lb:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2]

volumes:
  shared:
